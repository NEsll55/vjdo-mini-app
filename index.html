<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ВЖДО — Проверка вагона</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">
        <div class="header-title">🚂 Проверка вагона</div>
        <div class="header-subtitle">ВЖДО</div>
    </header>

    <main class="container">

        <!-- ОСНОВНАЯ ИНФОРМАЦИЯ -->

        <section class="card">

            <h2>🚆 Информация о поезде</h2>

            <label>
                Время прибытия
                <input
                    type="time"
                    id="arrival_time"
                >
            </label>

            <label>
                Номер пути
                <input
                    type="text"
                    id="track_number"
                    placeholder="Например: 5"
                >
            </label>

            <label>
                Номер поезда
                <input
                    type="text"
                    id="train_number"
                    placeholder="Например: 1234"
                >
            </label>

            <label>
                Номер вагона
                <input
                    type="text"
                    id="wagon_number"
                    placeholder="Например: 54872341"
                >
            </label>

        </section>


        <!-- ГРУЗ -->

        <section class="card">

            <h2>📦 Груз</h2>

            <label>
                Что находится в вагоне?
                <textarea
                    id="cargo"
                    rows="3"
                    placeholder="Например: зерно, уголь, пшеница..."
                ></textarea>
            </label>

        </section>


        <!-- ПЛОМБЫ -->

        <section class="card">

            <h2>🔒 Пломбы</h2>

            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="has_seals"
                >

                <span>Пломбы имеются</span>

            </label>

            <div id="seals_block" class="hidden">

                <label>
                    Количество пломб
                    <input
                        type="number"
                        id="seals_count"
                        min="0"
                        max="100"
                        value="0"
                    >
                </label>

                <div id="seals_container"></div>

            </div>

        </section>


        <!-- ЗАКРУТКИ -->

        <section class="card">

            <h2>🔩 Закрутки</h2>

            <label>
                Количество закруток
                <input
                    type="number"
                    id="twists_count"
                    min="0"
                    max="100"
                    value="0"
                >
            </label>

        </section>


        <!-- ПОВРЕЖДЕНИЯ -->

        <section class="card">

            <h2>⚠️ Повреждение вагона</h2>

            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="has_damage"
                >

                <span>Обнаружено повреждение</span>

            </label>

            <div id="damage_block" class="hidden">

                <label>
                    Опишите повреждение
                    <textarea
                        id="damage_description"
                        rows="5"
                        placeholder="Например: повреждена пломба, вмятина на боковой стенке, повреждён люк..."
                    ></textarea>
                </label>

            </div>

        </section>


        <!-- ОТПРАВЛЕНИЕ -->

        <section class="card">

            <h2>🚂 Отправление</h2>

            <label>
                Время отправления
                <input
                    type="time"
                    id="departure_time"
                >
            </label>

        </section>


        <!-- ФОТО -->

        <section class="card">

            <h2>📷 Фотографии</h2>

            <p class="hint">
                При необходимости прикрепите фотографии вагона,
                пломб или повреждений.
            </p>

            <input
                type="file"
                id="photos"
                accept="image/*"
                multiple
            >

            <div id="photo_preview"></div>

        </section>


        <!-- КНОПКА -->

        <button
            id="save_button"
            class="save-button"
        >
            ✅ Сохранить проверку
        </button>

        <div
            id="status"
            class="status"
        ></div>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
