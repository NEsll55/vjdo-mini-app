<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ВЖДО — Смены</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ШАПКА -->

    <header class="header">

        <div class="header-icon">
            🛡
        </div>

        <div>
            <div class="header-title">
                ВЖДО
            </div>

            <div class="header-subtitle">
                График смен
            </div>
        </div>

    </header>


    <main class="container">

        <!-- ТЕКУЩАЯ СМЕНА -->

        <section class="today-card">

            <div class="today-label">
                Сегодня
            </div>

            <div
                id="todayDate"
                class="today-date"
            >
                --
            </div>

            <div
                id="todayGuard"
                class="today-guard"
            >
                --
            </div>

        </section>


        <!-- КАЛЕНДАРЬ -->

        <section class="calendar-card">

            <div class="calendar-header">

                <button
                    id="prevMonth"
                    class="month-button"
                >
                    ‹
                </button>

                <div
                    id="monthTitle"
                    class="month-title"
                >
                    --
                </div>

                <button
                    id="nextMonth"
                    class="month-button"
                >
                    ›
                </button>

            </div>


            <!-- ДНИ НЕДЕЛИ -->

            <div class="weekdays">

                <div>Пн</div>
                <div>Вт</div>
                <div>Ср</div>
                <div>Чт</div>
                <div>Пт</div>
                <div>Сб</div>
                <div>Вс</div>

            </div>


            <!-- ДНИ -->

            <div
                id="calendar"
                class="calendar"
            ></div>

        </section>


        <!-- ЛЕГЕНДА -->

        <section class="legend-card">

            <div class="legend-title">
                Обозначения
            </div>

            <div class="legend">

                <div class="legend-item">
                    <span class="legend-color guard-1"></span>
                    <span>Караул №1</span>
                </div>

                <div class="legend-item">
                    <span class="legend-color guard-2"></span>
                    <span>Караул №2</span>
                </div>

                <div class="legend-item">
                    <span class="legend-color guard-3"></span>
                    <span>Караул №3</span>
                </div>

                <div class="legend-item">
                    <span class="legend-color guard-4"></span>
                    <span>Караул №4</span>
                </div>

            </div>

        </section>


        <!-- ИНФОРМАЦИЯ -->

        <section class="info-card">

            <div class="info-row">

                <span>📅</span>

                <span id="infoDate">
                    --
                </span>

            </div>

            <div class="info-row">

                <span>🛡</span>

                <strong id="infoGuard">
                    --
                </strong>

            </div>

        </section>

    </main>

</div>


<script src="app.js"></script>

</body>
</html>
